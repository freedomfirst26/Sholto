name: Release

# Build a self-contained binary and attach it to a GitHub Release whenever a
# version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # needed to create the Release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Self-contained builds cross-publish fine from Linux, so every RID runs
        # on this same ubuntu runner. Each entry names its archive format, the
        # platform word used in the asset name, and the scripts it ships.
        include:
          - rid: linux-x64
            platform: linux-x64
            ext: tar.gz
            scripts: install-deps.sh sholto-deps.sh get-sholto.sh
          - rid: win-x64
            platform: windows-x64
            ext: zip
            scripts: install-deps.ps1 sholto-deps.ps1 get-sholto.ps1

    env:
      ARCHIVE: sholto-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.ext }}
      ALIAS: sholto-${{ matrix.platform }}.${{ matrix.ext }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Optional: reuse NuGet packages across runs to speed the build up.
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish self-contained single file
        run: |
          dotnet publish src/Sholto.Host/Sholto.Host.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o dist

      # The version-less alias is a copy of the archive, so
      # releases/latest/download/sholto-<platform>.<ext> always works.
      - name: Package
        run: |
          cp README.md LICENSE THIRD-PARTY-NOTICES.md ${{ matrix.scripts }} dist/
          mkdir -p dist/docs && cp docs/license.md dist/docs/
          rm -f dist/*.pdb
          if [ "${{ matrix.ext }}" = "zip" ]; then
            (cd dist && zip -qr "../$ARCHIVE" .)
          else
            tar -C dist -czf "$ARCHIVE" .
          fi
          cp "$ARCHIVE" "$ALIAS"

      # Release notes come from CHANGELOG.md: the "## <tag>" section for this tag
      # (everything up to the next "## " heading). If the section is missing,
      # fall back to GitHub's auto-generated commit list so the release still ships.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ github.ref_name }}" '
            $0 ~ "^## " { inside = ($2 == tag) ; next }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No '## ${{ github.ref_name }}' section in CHANGELOG.md; using auto-generated notes"
          fi

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ALIAS }}
          # Release candidates (v0.9.0-rc1) publish as prereleases, so
          # releases/latest keeps pointing at the last full release.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
